[SystemSettings]
; The Sun stands a few degrees above the ground: the dither of the shadow map then shows as
; hatching on the ground. A normal bias of 7 keeps facets of the terrain that are turned just
; away from the Sun out of their own shadow: without it the edge of a shadow is a comb.
r.Shadow.Virtual.SMRT.TexelDitherScaleDirectional=0
r.Shadow.Virtual.NormalBias=7
; Sharper shadows of the Sun and the Earth (no atmosphere: hard edges).
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
