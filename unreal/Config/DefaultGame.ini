[/Script/UnrealEd.ProjectPackagingSettings]
; The project has no map of its own: the scene is built in code inside the empty engine map.
+MapsToCook=(FilePath="/Engine/Maps/Entry")
; The materials are loaded by path from code, so the cooker must be told about them.
+DirectoriesToAlwaysCook=(Path="/Game/Lsn")
; Result packages are plain files read at run time. Scripts/package.ps1 copies the published
; folder packages/ of the repository to Content/LsnPackages for the duration of the build.
+DirectoriesToAlwaysStageAsNonUFS=(Path="LsnPackages")
; Real terrain samples for drawing (Scripts/export_terrain.py); absent for synthetic packages.
+DirectoriesToAlwaysStageAsNonUFS=(Path="LsnTerrain")
; Scale objects made in Blender (Scripts/blender/make_scale_objects.py), read as plain files.
+DirectoriesToAlwaysStageAsNonUFS=(Path="LsnModels")
; Star list and sky orientation for drawing (Scripts/export_sky.py).
+DirectoriesToAlwaysStageAsNonUFS=(Path="LsnSky")
