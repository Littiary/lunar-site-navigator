[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsn-data"
version = "0.1.0"
description = "Lunar Site Navigator: LOLA data download, manifest, reader and pyramids"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lsn-data = "lsn_data.cli:main"

[tool.setuptools.packages.find]
include = ["lsn_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_data: test needs the downloaded LOLA files under the data root",
]
