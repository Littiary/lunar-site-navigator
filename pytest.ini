# pytest started at the repository root: `python -m pytest`, or with folder names
# (`python -m pytest core validation data`, as docs/setup.md says).
#
# Without this file pytest takes the first configuration it finds under the folders it is
# given, core/pyproject.toml, makes core/ the root of the run and does not load the
# conftest.py next to this file; test names of validation/ and data/ are then printed as
# if they were under core/, and the marker of the data tests is unknown. With it the
# repository root is the root of the run.
#
# Started inside core/ or data/, pytest still uses the pyproject.toml there. The tests of
# web/ are run from inside web/ (see web/README.md) and are not listed here.
[pytest]
testpaths = core/tests validation/tests data/tests
addopts = -q
markers =
    needs_data: test needs the downloaded LOLA files under the data root
