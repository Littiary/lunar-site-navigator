[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsncore"
version = "0.1.0"
description = "Science core of the Lunar Site Navigator: terrain horizon, lighting and Earth-visibility windows, written to versioned packages."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Stream B (ephemeris and validation) lists its dependencies here.
ephem = []

[project.scripts]
lsn = "lsncore.cli:main"

[tool.setuptools.packages.find]
include = ["lsncore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
